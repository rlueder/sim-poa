# Fontes de dados brutos do sim-poa.
#
# `pnpm data:fetch` baixa as fontes do grupo `default` para data/raw/<id>/ e
# registra cada arquivo em data/manifest.csv. Grupos opcionais entram com
# `pnpm data:fetch --group <nome>`.
#
# Tipos de fonte:
#   webdav  compartilhamento público do Nextcloud da Procempa (ObservaMOB/EPTC).
#           `include` e `exclude` são padrões fnmatch sobre o caminho dentro do
#           compartilhamento; `*` também atravessa pastas.
#   ckan    conjunto do portal dadosabertos.poa.br; baixa todos os recursos.
#   url     um arquivo, em `url`.
#
# A origem de cada fonte está descrita em
# docs/development/IMPLEMENTATION_GUIDE.md, seção 4.

[defaults]
webdav_base = "https://drive.procempa.com.br/public.php/webdav/"
ckan_base = "https://dadosabertos.poa.br/api/3/action/"
exclude = ["*Thumbs.db", "*.DS_Store", "*desktop.ini"]
pause_seconds = 1.0


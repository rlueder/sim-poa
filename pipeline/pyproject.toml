[project]
name = "sim-poa"
version = "0.1.0"
description = "Pipeline de dados e simulação do sim-poa"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "eclipse-sumo==1.28.0",
    "geopandas>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pyarrow>=26.0.1",
    "xlrd>=2.0.2",
]

[project.scripts]
sim-poa = "sim_poa.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Pacotes sem tipos publicados. Pacotes de stubs (types-openpyxl e afins)
# seriam dependências novas; até lá, o mypy os trata como não tipados.
[[tool.mypy.overrides]]
module = ["geopandas.*", "openpyxl.*", "xlrd.*", "pyarrow.*", "pdfplumber.*", "shapely.*", "pyproj.*", "pyogrio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["sumo: testes que executam os binários do SUMO"]
filterwarnings = ["error::FutureWarning"]

[project]
name = "sim-poa"
version = "0.1.0"
description = "Pipeline de dados e simulação do sim-poa"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = ["eclipse-sumo==1.28.0"]

[project.scripts]
sim-poa = "sim_poa.cli:main"

[dependency-groups]
dev = ["mypy>=2.4,<3", "pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["sumo: testes que executam os binários do SUMO"]
